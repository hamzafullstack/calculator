<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="calculator">
      <!-- Calculator Display Screen -->
      <input class="display" type="text" id="display" readonly placeholder="0" />

      <!-- Buttons -->
      <div id="buttons" class="buttons">
        <button class="btn" data-action="clear">AC</button>
        <button class="btn" data-action="percentage">%</button>
        <button class="btn" data-action="delete">DEL</button>
        <button class="btn" data-operator="/">/</button>
        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn" data-operator="*">*</button>
        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn" data-operator="-">-</button>
        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn" data-operator="+">+</button>
        <button class="btn" data-value="00">00</button>
        <button class="btn" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn" data-action="equals">=</button>
      </div>
    </div>
  </body>
</html>
